name: Kolaboro discovery agent
# Daily: finds new off-plan and under-construction projects with the Claude API (web search + fetch),
# validates them (2+ sources, live URL, no duplicates) and adds them to projects-world.json.
# Spends at most KB_DISCOVER_MAX_USD (0.25) per UTC day across all runs, then triggers the research agent.
on:
  schedule:
    - cron: '41 3 */2 * *'
  workflow_dispatch:
    inputs:
      min_usd:
        description: "Minimum spend today (USD, at most max_usd)"
        default: "0.25"
      force:
        description: "Run even if today's minimum is already spent (1 = yes)"
        default: ""
      markets:
        description: "Only these markets or countries, comma separated (empty = all, rotating)"
        default: ""
      max_calls:
        description: "Maximum Claude calls this run"
        default: "40"

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-discover
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-agent
      - name: Discover new projects
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KB_DISCOVER_MIN_USD: '0.10'
          KB_DISCOVER_MAX_USD: '0.10'
          KB_DISCOVER_MODEL: claude-haiku-5-5
          KB_DISCOVER_FORCE: ${{ github.event.inputs.force || '' }}
          KB_DISCOVER_MARKETS: ${{ github.event.inputs.markets || '' }}
          KB_DISCOVER_MAX_CALLS: ${{ github.event.inputs.max_calls || '40' }}
        run: python3 tools/kolaboro-agent/discover.py | tee "$RUNNER_TEMP/discover.out"
      - name: Save on main
        id: save
        run: |
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git add tools/kolaboro-agent/projects-world.json tools/kolaboro-agent/data/discover-log.json
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          N=$(tail -1 "$RUNNER_TEMP/discover.out" | python3 -c "import json,sys;print(json.loads(sys.stdin.read()).get('added',0))" 2>/dev/null || echo 0)
          git commit -q -m "kolaboro discover: $N new projects $(date -u +%F)"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; sleep 5; done
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Run the research agent to publish
        if: steps.save.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kolaboro-agent.yml --ref main -R "$GITHUB_REPOSITORY" -f max_calls=160
