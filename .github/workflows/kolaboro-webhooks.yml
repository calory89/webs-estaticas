name: Kolaboro partner webhooks
# Daily, after the research agent's run and the alerts job: calls the worker's webhook job with a GitHub OIDC token (no stored secret).
# The worker compares each watched project's public record with the last state and POSTs one Ed25519-signed event per change to each
# partner webhook (kolaboro.com/docs/webhooks/), retrying failures and logging every attempt. Project details stay out of this log.
on:
  schedule:
    - cron: '53 10 * * 3'
  workflow_dispatch:

permissions:
  id-token: write
  actions: write
concurrency:
  group: kolaboro-webhooks
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - name: Wait for the site deploy after an agent run
        if: github.event_name == 'workflow_run'
        run: sleep 240
      - name: Deliver webhook events
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok = json.load(urllib.request.urlopen(urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=kolaboro.com', headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}), timeout=15))['value']
          r = urllib.request.urlopen(urllib.request.Request('https://kolaboro.com/api/x/t/hooks/run', b'{}', {'content-type': 'application/json', 'authorization': 'Bearer ' + tok, 'user-agent': 'kolaboro-webhooks/1.0'}), timeout=600)
          print(r.status, r.read().decode()[:2000])
          PY
