name: Kolaboro outside probe
# Hourly: a second vantage point for uptime (GitHub's runners, outside Cloudflare and outside our database host).
# Results go to the worker with GitHub's OIDC token as proof of origin (no stored secret); they appear on kolaboro.com/status.
on:
  schedule:
    - cron: '13 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write
concurrency:
  group: kolaboro-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - name: Probe and report
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, datetime, os
          def probe(u):
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'user-agent': 'kolaboro-probe/1.0 (github actions)'}), timeout=15); s = r.status; r.read()
              except urllib.error.HTTPError as e: s = e.code
              except Exception: s = 0
              return {'status': s, 'ms': int((time.time() - t) * 1000), 'ok': 200 <= s < 400}
          now = datetime.datetime.utcnow().isoformat(timespec='seconds') + 'Z'; items = []
          for name, u in (('home', 'https://kolaboro.com/?probe=gh'), ('api', 'https://kolaboro.com/api/kb/health')):
              p = probe(u); p.update({'at': now, 'target': name}); items.append(p)
          print(json.dumps(items))
          tok = json.load(urllib.request.urlopen(urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=kolaboro.com', headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}), timeout=15))['value']
          r = urllib.request.urlopen(urllib.request.Request('https://kolaboro.com/api/kb/probe', json.dumps({'items': items}).encode(), {'content-type': 'application/json', 'authorization': 'Bearer ' + tok, 'user-agent': 'kolaboro-probe/1.0'}), timeout=20)
          print(r.status, r.read().decode()[:200])
          PY
