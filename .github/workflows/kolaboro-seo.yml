name: Kolaboro SEO
# Search and answer-engine upkeep for kolaboro.com (seoT, batch 8). Scripts: tools/kolaboro-seo/.
#  - indexnow (daily 09:41 UTC, about 1 minute, after the daily live-findings run is deployed): pin the true lastmod of every named
#    page (tools/kolaboro-seo/lastmod.py, state kolaboro.com/data/lastmod.json), then submit to IndexNow (Bing, Yandex, Naver, Seznam,
#    Yep) only the sitemap URLs whose lastmod moved, i.e. whose data really changed. Both files go out in one commit (one deploy).
#    State: kolaboro.com/data/indexnow.json. Google does not take IndexNow; it reads the sitemaps.
#    n26i (batch 26): the same daily job then runs tools/kolaboro-seo/daily.py: a different sample of sitemap URLs every day checked
#    for structured data (same rules as the audit) and every internal link on them for 404s and redirects; kolaboro.com/data/seo-daily.json.
#  - audit (weekly, Tuesday 09:47 UTC, and on demand): crawl every sitemap URL (GET and HEAD): status, canonical, hreflang reciprocity,
#    JSON-LD validity, image sitemap, true lastmod of static pages. Result: kolaboro.com/data/seo-audit.json, on /engineering/seo/.
# Batch 15 fix: the spend cut of 6 Nov left one weekly cron whose value matched neither job's condition, so no scheduled run happened.
on:
  schedule:
    - cron: '41 9 * * *'
    - cron: '47 9 * * 2'
  workflow_dispatch:
    inputs:
      job:
        description: 'which job to run'
        type: choice
        options: [both, indexnow, audit]
        default: both

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-seo
  cancel-in-progress: false
jobs:
  audit:
    if: (github.event_name == 'schedule' && github.event.schedule == '47 9 * * 2') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'indexnow')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-seo
            tools/kolaboro-reliability
      - name: Crawl audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/kolaboro-seo/audit.py "$RUNNER_TEMP/seo"
      - name: Publish to kolaboro.com
        run: |
          bash tools/kolaboro-reliability/publish.sh "kolaboro.com: SEO crawl audit $(date -u +%FT%H:%M)" "$RUNNER_TEMP/seo/seo-audit.json=_s/kolaboro.com/data/seo-audit.json"
  indexnow:
    if: (github.event_name == 'schedule' && github.event.schedule == '41 9 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'audit')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-seo
            tools/kolaboro-reliability
      - name: Pin the true lastmod of named pages
        id: pin
        run: |
          set +e; python3 tools/kolaboro-seo/lastmod.py "$RUNNER_TEMP/inow"; c=$?; set -e
          echo "code=$c" >> "$GITHUB_OUTPUT"
          if [ "$c" != "0" ] && [ "$c" != "3" ]; then echo "::warning::lastmod pin failed (exit $c); sitemaps keep the published pins"; fi
      - name: Submit to IndexNow
        id: inow
        run: |
          set +e; python3 tools/kolaboro-seo/indexnow.py "$RUNNER_TEMP/inow"; c=$?; set -e
          echo "code=$c" >> "$GITHUB_OUTPUT"
          if [ "$c" != "0" ] && [ "$c" != "3" ]; then echo "::warning::IndexNow submission did not return 200/202 (exit $c)"; fi
      - name: Daily sample check (structured data, internal 404s and redirects)
        id: daily
        run: |
          # n26i (batch 26): a different sample every day; result on /engineering/seo/ (kolaboro.com/data/seo-daily.json)
          set +e; timeout 900 python3 tools/kolaboro-seo/daily.py "$RUNNER_TEMP/inow"; c=$?; set -e
          echo "code=$c" >> "$GITHUB_OUTPUT"
          if [ "$c" = "3" ]; then echo "::warning::Daily sample check found broken links or structured-data problems (see kolaboro.com/data/seo-daily.json)"; elif [ "$c" != "0" ]; then echo "::warning::Daily sample check did not finish (exit $c)"; fi
      - name: Publish state to kolaboro.com (one commit for all files)
        run: |
          F=""
          [ -f "$RUNNER_TEMP/inow/seo-daily.json" ] && F="$F $RUNNER_TEMP/inow/seo-daily.json=_s/kolaboro.com/data/seo-daily.json"
          [ -f "$RUNNER_TEMP/inow/indexnow.json" ] && F="$F $RUNNER_TEMP/inow/indexnow.json=_s/kolaboro.com/data/indexnow.json"
          [ -f "$RUNNER_TEMP/inow/lastmod.json" ] && F="$F $RUNNER_TEMP/inow/lastmod.json=_s/kolaboro.com/data/lastmod.json"
          [ -n "$F" ] || { echo "nothing changed"; exit 0; }
          bash tools/kolaboro-reliability/publish.sh "kolaboro.com: true lastmod pins and IndexNow $(date -u +%FT%H:%M)" $F
