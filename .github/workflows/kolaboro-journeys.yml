name: Kolaboro user journeys
# Hourly: a real Chrome on a GitHub runner does what a buyer does on production kolaboro.com (home, search, open a project,
# verify its signed data on /verify, status page). Step timings and one screenshot per step go to kolaboro.com/data/journeys.json
# (last 48 runs) and /data/journeys/<step>.webp; they are shown on kolaboro.com/status.
on:
  schedule:
    - cron: '41 4 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-journeys
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-reliability
      - name: Journey
        run: |
          (cd "$RUNNER_TEMP" && npm i -s --no-save --no-package-lock playwright-core@1.64.1 >/dev/null)
          NODE_PATH="$RUNNER_TEMP/node_modules" node tools/kolaboro-reliability/journeys.js "$RUNNER_TEMP/j"
      - name: Compress screenshots
        if: always()
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          d = os.environ['RUNNER_TEMP'] + '/j/shots'
          for p in sorted(glob.glob(d + '/*.png')):
              im = Image.open(p).convert('RGB'); im.thumbnail((640, 400))
              im.save(p[:-4] + '.webp', 'WEBP', quality=50, method=6); print(p, os.path.getsize(p[:-4] + '.webp'))
          PY
      - name: Publish to kolaboro.com
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/j/journeys.json" ] || exit 1
          F=("$RUNNER_TEMP/j/journeys.json=_s/kolaboro.com/data/journeys.json")
          for w in "$RUNNER_TEMP"/j/shots/*.webp; do F+=("$w=_s/kolaboro.com/data/journeys/$(basename "$w")"); done
          bash tools/kolaboro-reliability/publish.sh "kolaboro.com: user journey $(date -u +%FT%H:%M)" "${F[@]}"
