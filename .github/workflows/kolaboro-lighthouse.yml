name: Kolaboro Lighthouse
# Daily and on demand: Lighthouse (pinned) on kolaboro.com's 20 most important pages (tools/kolaboro-lighthouse/pages.json), mobile and
# desktop. Results go to kolaboro.com/data/lighthouse.json and are shown on kolaboro.com/status. If a score falls below its threshold
# (tools/kolaboro-lighthouse/thresholds.json, set from the first real run) the job is marked failed and the drop is flagged in the
# published file. It never reverts anything: the deploy guard handles broken deploys, this only reports.
on:
  schedule:
    - cron: '23 4 17 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-lighthouse
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-lighthouse
            tools/kolaboro-reliability
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Lighthouse
        run: |
          (cd "$RUNNER_TEMP" && npm i -s --no-save --no-package-lock lighthouse@13.5.0 >/dev/null)
          export LIGHTHOUSE_BIN="$RUNNER_TEMP/node_modules/.bin/lighthouse" CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node tools/kolaboro-lighthouse/run.mjs "$RUNNER_TEMP/lh"
      - name: Publish to kolaboro.com
        run: |
          bash tools/kolaboro-reliability/publish.sh "kolaboro.com: Lighthouse $(date -u +%F)" "$RUNNER_TEMP/lh/lighthouse.json=_s/kolaboro.com/data/lighthouse.json"
      - name: Proposed thresholds (baseline run only)
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/lh/thresholds.proposed.json" ] && cat "$RUNNER_TEMP/lh/thresholds.proposed.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: '${{ runner.temp }}/lh/*.json', retention-days: 14 }
      - name: Fail on scores below threshold
        run: |
          N=$(cat "$RUNNER_TEMP/lh/flags.txt")
          if [ "$N" != "0" ]; then echo "::error::$N Lighthouse score(s) below threshold, see kolaboro.com/status and data/lighthouse.json"; exit 1; fi
