name: Kolaboro site manifest
# After each deploy (checked every 30 minutes): SHA-256 of every published kolaboro.com file outside /data/ at the commit the live
# site serves (kolaboro.com/data/site-manifest.json, served signed at /api/x/n/manifest), and a deterministic esbuild bundle hash
# of the worker for each new worker source tree (kolaboro.com/data/builds.json, served signed at /api/x/n/builds).
# Logic: tools/kolaboro-manifest/manifest.py. A file is committed to pub/_lovable only when its content changed, so the
# manifest's own deploy does not trigger another manifest.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-manifest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: tools/kolaboro-manifest
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kbm-cache
          key: kbm-blobs-${{ github.run_id }}
          restore-keys: kbm-blobs-
      - name: Hash the live commit and build the worker
        run: |
          set -e
          git fetch -q --depth=1 --filter=blob:none origin +refs/heads/pub/_lovable:refs/remotes/origin/pub/_lovable
          python3 tools/kolaboro-manifest/manifest.py
      - name: Publish to kolaboro.com
        run: |
          set -e
          O=$RUNNER_TEMP/kbm; ls $O/*.json >/dev/null 2>&1 || { echo "nothing changed"; exit 0; }
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            for f in $O/*.json; do H=$(git hash-object -w "$f"); git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/$(basename $f); done
            T=$(git write-tree --missing-ok); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: site manifest and build record $(date -u +%FT%H:%M)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 7; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
