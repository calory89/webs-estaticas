name: rh-pub-import
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of a .tgz laid out like the pub/_lovable root"
        required: true
      allow_new:
        description: "Space-separated paths that may be added (besides new assets/*, and new realhunt.co pages and sitemaps). Other new files are skipped."
        default: ""
      message:
        description: "Commit message"
        default: "Publish bundle"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pub/_lovable
          fetch-depth: 1
      - name: Download and merge (only changed existing files, new hashed assets and allow-listed files)
        env:
          URL: ${{ github.event.inputs.url }}
          ALLOW: ${{ github.event.inputs.allow_new }}
        run: |
          set -e
          curl -fsSL -X POST "$URL" -o /tmp/in.tgz || curl -fsSL "$URL" -o /tmp/in.tgz
          mkdir -p /tmp/x && tar -xzf /tmp/in.tgz -C /tmp/x
          python3 - <<'PY'
          import os, shutil, filecmp
          allow = set(os.environ.get("ALLOW", "").split())
          src = "/tmp/x"; upd = new_assets = added = skipped = 0
          for root, _, files in os.walk(src):
              for f in files:
                  s = os.path.join(root, f); rel = os.path.relpath(s, src); d = rel
                  if not (rel.startswith("assets/") or rel.startswith("_s/")): continue
                  if os.path.exists(d):
                      if not filecmp.cmp(s, d, shallow=False): shutil.copy2(s, d); upd += 1
                  elif rel.startswith("assets/"):
                      os.makedirs(os.path.dirname(d), exist_ok=True); shutil.copy2(s, d); new_assets += 1
                  elif rel in allow or (rel.startswith("_s/realhunt.co/") and (rel.endswith("/index.html") or (rel.count("/") == 2 and rel.endswith(".xml")))):
                      # realhunt.co pages are generated by the build (one index.html per home, country, guide and
                      # ranking) together with their sitemaps; a new home must be able to go live without a manual allow-list.
                      os.makedirs(os.path.dirname(d), exist_ok=True); shutil.copy2(s, d); added += 1
                  else: skipped += 1
          print(f"updated={upd} new_assets={new_assets} added={added} skipped_new={skipped}")
          PY
          echo "files in deploy: $(git ls-files | wc -l) + new $(git status --porcelain | grep -c '^??' || true)"
          total=$(( $(git ls-files | wc -l) + $(git status --porcelain --untracked-files=all | grep -c '^??' || true) ))
          echo "total=$total"; if [ $total -gt 19500 ]; then echo "too many files for Cloudflare Pages"; exit 1; fi
      - name: Commit
        env:
          MSG: ${{ github.event.inputs.message }}
        run: |
          git config user.name "calory89"; git config user.email "rrppspain@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "$MSG"
          for i in 1 2 3 4 5; do git push origin HEAD:pub/_lovable && exit 0; git pull --rebase -q origin pub/_lovable; sleep 5; done; exit 1
