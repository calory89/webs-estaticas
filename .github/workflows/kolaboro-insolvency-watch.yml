name: Kolaboro insolvency watch
# Daily: developer company names from the private research records (UK and Spain) against official insolvency notices:
# The Gazette (UK, corporate insolvency notices only) and BORME Section A "Situacion concursal" acts (Spain).
# Publishes kolaboro.com/data/insolvency-watch.json (anonymised counts per market and project id) and
# kolaboro.com/data/insolvency-es-index.json (hashed index of Spanish insolvency acts for the buyer lookup).
# The human-readable reason for each hit, with the company name, is kept as a private workflow artifact.
on:
  schedule:
    - cron: '23 7 5 * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'BORME days to (re)scan when missing from the index'
        default: '180'

permissions:
  contents: write
concurrency:
  group: kolaboro-insolvency-watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-w
            tools/kolaboro-agent/agent.py
            tools/kolaboro-agent/projects.json
            tools/kolaboro-agent/projects-world.json
            tools/kolaboro-agent/research
          sparse-checkout-cone-mode: false
      - name: Build
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/site/data" "$RUNNER_TEMP/private"
          python3 -I tools/kolaboro-w/insolvency_watch.py tools/kolaboro-agent "$RUNNER_TEMP/site/data" "$RUNNER_TEMP/private/insolvency-hits.json" "${{ github.event.inputs.backfill_days || '180' }}" 2> "$RUNNER_TEMP/private/log.txt" || { tail -20 "$RUNNER_TEMP/private/log.txt"; exit 1; }
          tail -2 "$RUNNER_TEMP/private/log.txt"
          R=$(python3 -I -c "import json,sys;d=json.load(open(sys.argv[1]));print(len(d['days']))" "$RUNNER_TEMP/site/data/insolvency-es-index.json")
          if [ "$R" = "0" ]; then echo "BORME unreachable: not publishing"; echo "SKIP=1" >> $GITHUB_ENV; fi
      - name: Keep the private hit reasons (artifact, 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: insolvency-private
          path: ${{ runner.temp }}/private
          retention-days: 90
      - name: Publish to kolaboro.com
        if: env.SKIP != '1'
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            for f in insolvency-watch.json insolvency-es-index.json; do
              H=$(git hash-object -w "$RUNNER_TEMP/site/data/$f")
              git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/$f
            done
            T=$(git write-tree --missing-ok); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: insolvency watch $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 7; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
