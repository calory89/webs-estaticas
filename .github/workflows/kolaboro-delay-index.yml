name: Kolaboro delay index
# Delivery-delay index by market, on-time odds per project id and the monthly press release (block V).
# Rebuilt daily from the public /data/bali-cases.json so the in-browser check matches; one snapshot is frozen per month;
# the press release is regenerated on the first run of each month, on push and on manual dispatch.
on:
  schedule:
    - cron: '7 3 1 * *'
    # n40 k22 (26 Nov 2026): weekly run moved from 16:37 to 00:41 UTC, right after the daily Kolaboro Actions budget resets;
    # at 16:37 the budget gate had already cancelled it (12 and 19 Nov), so /data/delay-index.json stayed on the 5 Nov input.
    - cron: '41 0 * * 4'
  workflow_dispatch:
    inputs:
      press:
        description: "Regenerate this month's press release (yes/no)"
        default: "no"

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-delay-index
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-v
      - name: Build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          I=$RUNNER_TEMP/in; O=$RUNNER_TEMP/out; mkdir -p $I $O
          K=_s/kolaboro.com
          git show FETCH_HEAD:$K/data/bali-cases.json > $I/cases.json
          git show FETCH_HEAD:$K/data/price-index.json > $I/prices.json || true
          git show FETCH_HEAD:$K/data/delay-index.json > $I/delay.json || true
          git show FETCH_HEAD:$K/data/on-time.json > $I/ontime.json || true
          git show FETCH_HEAD:$K/press/monthly/release.json > $I/release.json || true
          git show FETCH_HEAD:$K/press/monthly/index.html > $I/page.html || true
          F=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.press }}" = "yes" ]; then F="--force-press"; fi
          python3 tools/kolaboro-v/delay_index.py --cases $I/cases.json --prices $I/prices.json --prev-delay $I/delay.json --prev-ontime $I/ontime.json \
            --prev-release $I/release.json --template $I/page.html --out $O $F | tee $RUNNER_TEMP/summary.json
          echo "### Delay index" >> $GITHUB_STEP_SUMMARY; cat $RUNNER_TEMP/summary.json >> $GITHUB_STEP_SUMMARY
      - name: Publish to kolaboro.com
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          O=$RUNNER_TEMP/out; K=_s/kolaboro.com
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            for f in delay-index.json on-time.json; do
              H=$(git hash-object -w "$O/$f"); git update-index --add --cacheinfo 100644,$H,$K/data/$f
            done
            for f in index.html release.json release.txt chart-delays.svg chart-months-late.svg chart-transparency.svg; do
              [ -f "$O/press/$f" ] || continue
              H=$(git hash-object -w "$O/press/$f"); git update-index --add --cacheinfo 100644,$H,$K/press/monthly/$f
            done
            # n33b: frozen monthly edition of the transparency ranking by market (only written when the press release is regenerated)
            for f in $(ls "$O/tm" 2>/dev/null); do
              git cat-file -e "$P:$K/data/transparency-monthly/$f" 2>/dev/null && continue   # an edition, once published, never changes
              H=$(git hash-object -w "$O/tm/$f"); git update-index --add --cacheinfo 100644,$H,$K/data/transparency-monthly/$f
            done
            T=$(git write-tree); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: delay index and on-time odds $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
