name: Kolaboro corporate family (GLEIF level 2)
# Weekly: every developer on the named pages (kolaboro.com/data/named.json), matched to a Legal Entity Identifier record on the
# GLEIF API (CC0, no key) by exact legal name plus country, with its direct and ultimate parents and direct children.
# Publishes kolaboro.com/data/gleif-family.json (read by developer pages and /graph/developers/). Companies only, no people.
# Light by design (budget rule, 9 Nov): incremental from the published file, at most 400 GLEIF requests (a few minutes),
# nothing is committed when nothing changed.
on:
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-gleif-family
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-w
          sparse-checkout-cone-mode: false
      - name: Build
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/site/data"
          curl -sSf --retry 3 -o "$RUNNER_TEMP/named.json" "https://kolaboro.com/data/named.json?w=gleif-family"
          curl -sSf --retry 3 -o "$RUNNER_TEMP/prev.json" "https://kolaboro.com/data/gleif-family.json?w=gleif-family" || rm -f "$RUNNER_TEMP/prev.json"
          [ -s "$RUNNER_TEMP/prev.json" ] || { echo "no published file to build on (a full build is a manual run of the script): not running"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; }
          set +e
          python3 -I tools/kolaboro-w/gleif_family.py "$RUNNER_TEMP/named.json" "$RUNNER_TEMP/site/data/gleif-family.json" "$RUNNER_TEMP/prev.json" 400 2> "$RUNNER_TEMP/log.txt"
          RC=$?; set -e; tail -2 "$RUNNER_TEMP/log.txt"
          if [ "$RC" = "3" ]; then echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          [ "$RC" = "0" ] || { tail -20 "$RUNNER_TEMP/log.txt"; exit 1; }
      - name: Publish to kolaboro.com
        if: env.SKIP != '1'
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w "$RUNNER_TEMP/site/data/gleif-family.json")
            git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/gleif-family.json
            T=$(git write-tree --missing-ok); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: corporate family (GLEIF level 2) $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 7; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
