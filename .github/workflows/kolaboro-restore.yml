name: Kolaboro restore drill
# Weekly: restores the newest daily backup into an empty Postgres 16, checks row counts, data hashes and evidence files,
# and publishes the result (counts and hashes only) to kolaboro.com/data/restore.json. Fails if the drill fails.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: kolaboro-restore
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: restore
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-agent
      - name: Restore drill
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: drill
          PGDATABASE: restore
        run: python3 tools/kolaboro-agent/restore_drill.py tools/kolaboro-agent/backups "$RUNNER_TEMP/restore.json" || echo "DRILL_FAILED=1" >> "$GITHUB_ENV"
      - name: Publish to kolaboro.com
        run: |
          set -e
          [ -s "$RUNNER_TEMP/restore.json" ] || { echo "no result to publish"; exit 0; }
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w "$RUNNER_TEMP/restore.json")
            git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/restore.json
            T=$(git write-tree); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: restore drill $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
      - name: Fail if the drill failed
        run: '[ -z "$DRILL_FAILED" ] || { echo "restore drill failed, see restore.json"; exit 1; }'
