name: Kolaboro render reuse
# Weekly: CLIP embeddings of the images on tracked project websites, cross-project matches published to kolaboro.com/data/render-reuse.json,
# plus kdh1 perceptual hashes of every kept image (kolaboro.com/data/image-hashes.json) for the in-browser check at /tools/image-check/.
on:
  schedule:
    - cron: '37 6 7 * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: kolaboro-render-reuse
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-agent
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-b-32-laion2b-s34b-b79k
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kolaboro-render-emb
          key: render-emb-${{ github.run_id }}
          restore-keys: render-emb-
      - name: Install
        run: |
          pip install -q torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q open_clip_torch==2.29.0 opencv-python-headless==4.10.0.84 pillow==11.0.0 imagehash==4.3.1 numpy==2.1.3
      - name: Published case ids
        run: |
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          git show FETCH_HEAD:_s/kolaboro.com/data/bali-cases.json > "$RUNNER_TEMP/bali-cases.json"
      - name: Find reused renders
        env:
          EMB_CACHE: /home/runner/.cache/kolaboro-render-emb/emb.npz
          CASES_JSON: ${{ runner.temp }}/bali-cases.json
        run: python3 tools/kolaboro-agent/render_reuse.py "$RUNNER_TEMP/render-reuse.json"
      - name: Publish to kolaboro.com
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w "$RUNNER_TEMP/render-reuse.json")
            git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/render-reuse.json
            if [ -s "$RUNNER_TEMP/image-hashes.json" ]; then
              H2=$(git hash-object -w "$RUNNER_TEMP/image-hashes.json")
              git update-index --add --cacheinfo 100644,$H2,_s/kolaboro.com/data/image-hashes.json
            fi
            T=$(git write-tree); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: render reuse $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
