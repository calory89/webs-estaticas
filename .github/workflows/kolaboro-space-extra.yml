name: Kolaboro radar and building footprints
# Monthly (after the optical progress run): Sentinel-1 RTC radar for cloudy plots (Microsoft Planetary Computer, anonymous SAS token)
# and Overture Maps buildings with GERS first-seen dates for every project with a plot-level pin. No model calls.
# Publishes kolaboro.com/data/satellite-radar.json and kolaboro.com/data/buildings.json (tools/kolaboro-agent/space_extra.py).
on:
  schedule:
    - cron: '41 6 13 * *'
  workflow_dispatch:
    inputs:
      what: { description: 'radar, buildings or both', required: false, default: 'both' }
      only: { description: 'comma separated project ids (empty = all)', required: false, default: '' }

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-space-extra
  cancel-in-progress: false
jobs:
  run:
    # radar and buildings run side by side; each publishes its own file
    strategy:
      fail-fast: false
      matrix:
        part: [radar, buildings]
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-agent
      - name: Build
        env:
          WHAT: ${{ github.event.inputs.what || 'both' }}
          PART: ${{ matrix.part }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          pip install -q rasterio numpy shapely duckdb datafusion
          mkdir -p "$RUNNER_TEMP/out"
          A=""; [ -n "$ONLY" ] && A="--only $ONLY"
          [ "$WHAT" = "both" ] || [ "$WHAT" = "$PART" ] || { echo "skip $PART"; exit 0; }
          if [ "$PART" = "radar" ]; then python3 -u -W ignore tools/kolaboro-agent/space_extra.py radar "$RUNNER_TEMP/out/satellite-radar.json" --budget-min 140 $A || true; fi
          if [ "$PART" = "buildings" ]; then python3 -u -W ignore tools/kolaboro-agent/space_extra.py buildings "$RUNNER_TEMP/out/buildings.json" $A || true; fi
          ls -la "$RUNNER_TEMP/out"
      - name: Publish to kolaboro.com
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -e
          cd "$RUNNER_TEMP/out"
          for f in satellite-radar.json buildings.json; do
            [ -f "$f" ] || continue
            python3 -c "import json,sys; d=json.load(open('$f')); assert d.get('projects'), 'empty'" || { echo "skip $f (empty)"; rm -f "$f"; continue; }
            if [ -n "$ONLY" ]; then   # partial run: merge into the published file
              curl -sf "https://kolaboro.com/data/$f?run=$(date +%s)" -o "prev-$f" || echo '{"projects":{}}' > "prev-$f"
              python3 -c "import json; p=json.load(open('prev-$f')); n=json.load(open('$f')); p2=dict(p.get('projects',{})); p2.update(n['projects']); n['projects']=p2; json.dump(n,open('$f','w'),separators=(',',':'),ensure_ascii=False)"
            fi
          done
          ls *.json 2>/dev/null | grep -v '^prev-' > files.txt || true
          [ -s files.txt ] || { echo "nothing to publish"; exit 0; }
          cd "$GITHUB_WORKSPACE"
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          for i in 1 2 3 4 5; do
            git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            while read f; do H=$(git hash-object -w "$RUNNER_TEMP/out/$f"); git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/$f; done < "$RUNNER_TEMP/out/files.txt"
            T=$(git write-tree --missing-ok); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: radar and building footprints $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 7
          done; exit 1
