name: Kolaboro developer websites
# Daily: one homepage request per own developer website (robots.txt respected, weekly), DNS over HTTPS, the TLS certificate
# from the handshake, registry RDAP expiry (weekly) and sitemap freshness (weekly). No model calls.
# Publishes kolaboro.com/data/web-health.json (website health on named project and developer pages, push-alert state) and
# kolaboro.com/data/dev-links.json (public identifiers shared by websites of different developers, /graph/developers/).
# tools/kolaboro-agent/dev_web.py. Private state (robots, RDAP, sitemap results with dates) stays in the Actions cache.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      only: { description: 'comma separated domains (empty = all)', required: false, default: '' }

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-devweb
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-agent/dev_web.py
            tools/kolaboro-reliability
          sparse-checkout-cone-mode: false
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dev-web-private.json
          key: devweb-state-${{ github.run_id }}
          restore-keys: devweb-state-
      - name: Build
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          A=""; [ -n "$ONLY" ] && A="--only $ONLY"
          python3 tools/kolaboro-agent/dev_web.py "$RUNNER_TEMP/out" --state "$RUNNER_TEMP/dev-web-private.json" $A
          python3 -c "import json,sys;h=json.load(open('$RUNNER_TEMP/out/web-health.json'));l=json.load(open('$RUNNER_TEMP/out/dev-links.json'));assert h['n']>=(1 if '$ONLY' else 300),h['n'];print('health',h['n'],'runner_ok',h['runner_ok'],'groups',len(l['groups']))"
      - name: Publish to kolaboro.com
        if: github.event.inputs.only == '' || github.event.inputs.only == null
        run: |
          bash tools/kolaboro-reliability/publish.sh "kolaboro.com: developer website health and shared identifiers $(date -u +%F)" \
            "$RUNNER_TEMP/out/web-health.json=_s/kolaboro.com/data/web-health.json" \
            "$RUNNER_TEMP/out/dev-links.json=_s/kolaboro.com/data/dev-links.json"
