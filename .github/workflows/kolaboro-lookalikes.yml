name: Kolaboro lookalike websites
# Daily (n19a, batch 19): new websites whose names resemble the developer and project websites in the named project data.
# Certificate Transparency (crt.sh PostgreSQL, else a rotating crt.sh JSON search), registered lookalike names in public DNS
# (a fourteenth of the websites per day, about 6 minutes in all), registry RDAP registration dates. The lookalike sites are never opened. No model calls.
# tools/kolaboro-agent/fake_sites.py publishes kolaboro.com/data/lookalikes.json; private state stays in the Actions cache.
on:
  schedule:
    - cron: '41 3 */2 * *'   # every second day: 0.50 USD/day budget, 9 Nov 2026
  workflow_dispatch:
    inputs:
      only: { description: 'comma separated official domains (empty = all, published)', required: false, default: '' }

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-lookalikes
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-agent/fake_sites.py
            tools/kolaboro-reliability
          sparse-checkout-cone-mode: false
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lookalikes-private.json
          key: lookalikes-state-${{ github.run_id }}
          restore-keys: lookalikes-state-
      - name: Build
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          A=""; [ -n "$ONLY" ] && A="--only $ONLY"
          python3 -u tools/kolaboro-agent/fake_sites.py "$RUNNER_TEMP/out" --state "$RUNNER_TEMP/lookalikes-private.json" $A
          python3 -c "import json;j=json.load(open('$RUNNER_TEMP/out/lookalikes.json'));assert j['watched']>=(1 if '$ONLY' else 250),j['watched'];print('items',j['n'],'unchanged',j.get('unchanged'))"
      - name: Publish to kolaboro.com
        if: github.event.inputs.only == '' || github.event.inputs.only == null
        run: |
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('$RUNNER_TEMP/out/lookalikes.json')).get('unchanged') else 1)"; then echo "items unchanged and published less than 3 days ago: skip"; exit 0; fi
          bash tools/kolaboro-reliability/publish.sh "kolaboro.com: lookalike websites $(date -u +%F)" \
            "$RUNNER_TEMP/out/lookalikes.json=_s/kolaboro.com/data/lookalikes.json"
