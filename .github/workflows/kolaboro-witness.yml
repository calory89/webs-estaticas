name: Kolaboro log witness
# Kolaboro's own first witness of its public log, run on GitHub's machines (outside Cloudflare and our database).
# Daily: download kolaboro.com/api/open/checkpoint, check the log signature, check with an RFC 9162 consistency proof that the
# tree only grew since the checkpoint saved in tools/kolaboro-witness/state.json, cosign (C2SP tlog-cosignature, Ed25519) and
# submit to kolaboro.com/api/x/o/witness. A rewritten log makes this job refuse to sign and fail.
# Needs the repository secret KB_WITNESS_KEY (base64 Ed25519 seed, made with: python3 kolaboro_witness.py keygen witness.key).
# Without it the job only reports that nothing was signed.
on:
  schedule:
    - cron: '43 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write
concurrency:
  group: kolaboro-witness
  cancel-in-progress: false
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-witness
      - name: Verify the log and cosign
        env:
          KB_WITNESS_KEY: ${{ secrets.KB_WITNESS_KEY }}
        run: |
          python3 tools/kolaboro-witness/kolaboro_witness.py run --name kolaboro.com/witness/github-actions \
            --state tools/kolaboro-witness/state.json --submit --github-oidc --contact "https://kolaboro.com/log/witnesses/"
      - name: Keep what this witness saw
        run: |
          [ -f tools/kolaboro-witness/state.json ] || exit 0
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git add tools/kolaboro-witness/state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "kolaboro witness: state $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((5 + i * 3)); done; exit 1
