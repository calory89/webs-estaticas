name: Kolaboro developer intelligence
# Daily, and after each research agent run: website age (RDAP + Certificate Transparency) and promise drift (day-by-day
# changes on developer pages) per anonymous project id, published to kolaboro.com/data/domain-age.json and promise-drift.json.
# Domains stay private: the lookup cache lives only in the Actions cache, the public files carry derived dates only.
on:
  schedule:
    - cron: '43 9 * * *'
  workflow_run:
    workflows: ['Kolaboro research agent']
    types: [completed]
  push:
    branches: [main]
    paths: ['tools/kolaboro-agent/dev_intel.py', '.github/workflows/kolaboro-devintel.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kolaboro-devintel
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-agent
      - uses: actions/cache@v4
        with:
          path: tools/kolaboro-agent/data/domain-age-private.json
          key: devintel-domains-${{ github.run_id }}
          restore-keys: devintel-domains-
      - name: Build
        run: python3 tools/kolaboro-agent/dev_intel.py "$RUNNER_TEMP/out"
      - name: Publish to kolaboro.com
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            for f in domain-age.json promise-drift.json; do
              H=$(git hash-object -w "$RUNNER_TEMP/out/$f")
              git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/$f
            done
            T=$(git write-tree); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: developer intelligence $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
