name: Kolaboro land watch (night lights, stalled sites)
# Weekly. Two open-data checks on tracked projects with coordinates (block U, batch 4). Coordinates stay private:
#  - night: NASA Black Marble VNP46A2 via NASA GIBS (no login) at projects that should be finished -> kolaboro.com/data/night-lights.json
#  - stalled: Sentinel-2 L2A change between clear quarters at every project with coordinates -> kolaboro.com/data/stalled-sites.json
# No paid imagery, no API keys.
on:
  schedule:
    - cron: '41 4 12 * *'
  workflow_dispatch:
    inputs:
      only: { description: 'night, stalled or empty for both', required: false, default: '' }

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-landwatch
  cancel-in-progress: false
jobs:
  night:
    if: github.event.inputs.only != 'stalled'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-agent
            tools/kolaboro-hazards
            tools/kolaboro-landwatch
      - name: Private ids and public cases
        run: |
          set -e
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          git show FETCH_HEAD:_s/kolaboro.com/data/bali-cases.json > "$RUNNER_TEMP/cases.json"
          python3 tools/kolaboro-hazards/ids.py "$RUNNER_TEMP/ids.json"
      - name: Night lights
        run: |
          pip install -q numpy pillow
          python3 -W ignore tools/kolaboro-landwatch/night.py "$RUNNER_TEMP/ids.json" "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/night-lights.json"
          rm -f "$RUNNER_TEMP/ids.json"
      - name: Publish to kolaboro.com
        env: { F: night-lights.json, MSG: night lights }
        run: bash tools/kolaboro-landwatch/publish.sh
  stalled:
    if: github.event.inputs.only != 'night'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-agent
            tools/kolaboro-hazards
            tools/kolaboro-landwatch
      - name: Private ids
        run: python3 tools/kolaboro-hazards/ids.py "$RUNNER_TEMP/ids.json"
      - name: Sentinel-2 change per project
        run: |
          pip install -q rasterio pystac-client numpy
          python3 -W ignore tools/kolaboro-landwatch/stalled.py "$RUNNER_TEMP/ids.json" "$RUNNER_TEMP/stalled-sites.json" --budget-min 55 --workers 10
          rm -f "$RUNNER_TEMP/ids.json"
      - name: Publish to kolaboro.com
        env: { F: stalled-sites.json, MSG: stalled-site check }
        run: bash tools/kolaboro-landwatch/publish.sh
