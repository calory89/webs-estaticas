name: Kolaboro AI benchmark
# On demand: score one model alone (Haiku or Sonnet) on the open evaluation set kolaboro.com/open/evals, through the production
# desk review. The worker forces the other model off for this run only (GitHub OIDC token, audience kolaboro.com, no stored secret).
# Results, signed per case, go to kolaboro.com/data/benchmark/<model>.json and the leaderboard at kolaboro.com/benchmark/.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'haiku or sonnet'
        required: true
        default: haiku

permissions:
  contents: write
  id-token: write
  actions: write
concurrency:
  group: kolaboro-benchmark
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-benchmark
            tools/kolaboro-reliability
      - name: Run the benchmark
        env:
          MODEL: ${{ github.event.inputs.model }}
        run: |
          case "$MODEL" in haiku|sonnet) ;; *) echo "model must be haiku or sonnet"; exit 1;; esac
          python3 tools/kolaboro-benchmark/run.py "$MODEL" "$RUNNER_TEMP/$MODEL.json"
      - name: Publish to kolaboro.com
        env:
          MODEL: ${{ github.event.inputs.model }}
        run: |
          bash tools/kolaboro-reliability/publish.sh "kolaboro.com: AI benchmark $MODEL $(date -u +%F)" "$RUNNER_TEMP/$MODEL.json=_s/kolaboro.com/data/benchmark/$MODEL.json"
