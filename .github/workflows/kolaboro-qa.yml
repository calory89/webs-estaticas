name: Kolaboro QA
# Daily check of every kolaboro.com page on mobile and desktop: broken links, JS errors, failed assets, overflow.
# A failed run means something on the live site needs fixing (GitHub emails the repo owner).
on:
  schedule:
    - cron: '23 5 10 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/kolaboro-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: cd tools/kolaboro-qa && npm init -y >/dev/null && npm i playwright@1.47.2 axe-core@4.10.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Crawl kolaboro.com
        run: cd tools/kolaboro-qa && KB_QA_OUT=$RUNNER_TEMP/qa.json node crawl.js
        continue-on-error: true
        id: crawl
      - name: Reproduce every Trust Score from the open code and data
        if: always()
        continue-on-error: true
        id: repro
        run: cd tools/kolaboro-qa && KB_QA_OUT=$RUNNER_TEMP/qa.json python3 reproduce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolaboro-qa
          path: ${{ runner.temp }}/qa.json
      - name: Publish the result to kolaboro.com/status
        if: always()
        run: |
          set -e
          [ -s "$RUNNER_TEMP/qa.json" ] || exit 0
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w "$RUNNER_TEMP/qa.json")
            git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/qa.json
            T=$(git write-tree); unset GIT_INDEX_FILE
            C=$(git -c user.name=kolaboro-qa -c user.email=qa@kolaboro.com commit-tree $T -p $P -m "kolaboro.com: daily QA result $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
      - name: Fail the run if the crawl found problems
        if: steps.crawl.outcome == 'failure'
        run: exit 1
