name: Kolaboro QA
# Daily check of every kolaboro.com page on mobile and desktop: broken links, JS errors, failed assets, overflow.
# A failed run means something on the live site needs fixing (GitHub emails the repo owner).
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/kolaboro-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: cd tools/kolaboro-qa && npm init -y >/dev/null && npm i playwright@1.47.2 axe-core@4.10.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Crawl kolaboro.com
        run: cd tools/kolaboro-qa && KB_QA_OUT=$RUNNER_TEMP/qa.json node crawl.js
        continue-on-error: true
        id: crawl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolaboro-qa
          path: ${{ runner.temp }}/qa.json
      - name: Publish the result to kolaboro.com/status
        if: always()
        run: |
          set -e
          [ -s "$RUNNER_TEMP/qa.json" ] || exit 0
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w "$RUNNER_TEMP/qa.json")
            git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/qa.json
            T=$(git write-tree); unset GIT_INDEX_FILE
            C=$(git -c user.name=kolaboro-qa -c user.email=qa@kolaboro.com commit-tree $T -p $P -m "kolaboro.com: daily QA result $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
      - name: Fail the run if the crawl found problems
        if: steps.crawl.outcome == 'failure'
        run: exit 1
