# carlosdeory.com: auditoria mensual automatica de la web en vivo. Abre un issue con lo que encuentre.
name: cdo-monthly-audit
on:
  schedule:
    - cron: "17 5 2 * *"
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/cdo, sparse-checkout-cone-mode: false }
      - name: Auditar carlosdeory.com
        run: python3 .github/cdo/cdo_audit.py > informe.md; cat informe.md
      - name: Abrir issue si hay problemas
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if grep -q '^- ' informe.md; then
            gh issue create -R "${{ github.repository }}" --title "carlosdeory.com: auditoria $(date +%Y-%m)" --body-file informe.md
          fi
