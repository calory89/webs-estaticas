name: Kolaboro research agent
# Weekly: reads what Bali developers advertise, extracts it with the Claude API, logs changes
# (internal, this private repo) and publishes aggregates only to kolaboro.com/data/bali-claims.json.
# Hard cap: 0.25 USD per UTC day for all runs together (KB_DAY_USD, summed from data/runs.json).
on:
  schedule:
    - cron: '17 6 1,15 * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Max Claude API calls this run"
        default: "160"

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-agent
      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KB_MAX_CALLS: ${{ github.event.inputs.max_calls || '160' }}
          KB_MAX_USD: '0.25'
          KB_DAY_USD: '0.25'
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY secret is not set: rebuilding aggregates from seed data only"; fi
          python3 tools/kolaboro-agent/agent.py "$RUNNER_TEMP/bali-claims.json"
          # named index for the project and developer pages (/projects/<slug>/, /developers/<slug>/, batch 8): names, pages read, sourced facts
          python3 tools/kolaboro-agent/named.py "$RUNNER_TEMP/bali-cases.json" "$RUNNER_TEMP/named.json" || echo "::warning::named index not built"
      - name: Save internal data on main
        run: |
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git add tools/kolaboro-agent/data
          git diff --cached --quiet && exit 0
          git commit -q -m "kolaboro agent: run $(date -u +%F)"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; sleep 5; done; exit 1
      - name: Publish aggregates to kolaboro.com
        run: |
          set -e
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w "$RUNNER_TEMP/bali-claims.json")
            git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/bali-claims.json
            H2=$(git hash-object -w "$RUNNER_TEMP/bali-cases.json")
            git update-index --add --cacheinfo 100644,$H2,_s/kolaboro.com/data/bali-cases.json
            H3=$(git hash-object -w "$RUNNER_TEMP/world-claims.json")
            git update-index --add --cacheinfo 100644,$H3,_s/kolaboro.com/data/world-claims.json
            if [ -s "$RUNNER_TEMP/named.json" ]; then H4=$(git hash-object -w "$RUNNER_TEMP/named.json"); git update-index --add --cacheinfo 100644,$H4,_s/kolaboro.com/data/named.json; fi
            T=$(git write-tree); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: research agent data $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
