name: happylowcost chollos
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hlc-chollos
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar si hay chollos nuevos
        id: chk
        run: |
          NEW=$(curl -fsS "https://gmdalfsvtfhzepyrdmjj.supabase.co/functions/v1/hlc-deals?action=feed" | sha256sum | cut -d' ' -f1)
          LIVE=$(curl -fsS "https://www.happylowcost.com/chollos/feed.sha?t=$(date +%s)" | tr -d '[:space:]' || true)
          echo "new=$NEW live=$LIVE"
          if [ "$NEW" = "$LIVE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "go=no" >> $GITHUB_OUTPUT; else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.go == 'yes'
        with:
          ref: pub/happylowcost.com
          fetch-depth: 1
      - name: Generar páginas de chollos
        if: steps.chk.outputs.go == 'yes'
        run: |
          pip install --quiet Pillow
          python3 _hlc/gen_deals.py
          HLC_ONLY=chollos python3 _hlc/build.py
      - name: Publicar
        if: steps.chk.outputs.go == 'yes'
        run: |
          git config user.name "happylowcost-bot"
          git config user.email "bot@happylowcost.com"
          git add -A chollos chollos-sitemap.xml sitemap_index.xml
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "chollos: actualización automática"
          git push origin HEAD:pub/happylowcost.com
