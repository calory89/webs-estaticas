name: happylowcost chollos
on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hlc-chollos
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar si hay chollos nuevos
        id: chk
        run: |
          A=$(curl -fsS "https://gmdalfsvtfhzepyrdmjj.supabase.co/functions/v1/hlc-deals?action=feed" | sha256sum | cut -d' ' -f1)
          B=$(curl -fsS "https://gmdalfsvtfhzepyrdmjj.supabase.co/functions/v1/hlc-deals?action=dests" | sha256sum | cut -c1-16)
          NEW="$A$B"
          LIVE=$(curl -fsS "https://www.happylowcost.com/chollos/feed.sha?t=$(date +%s)" | tr -d '[:space:]' || true)
          R=$(curl -fsS "https://gmdalfsvtfhzepyrdmjj.supabase.co/functions/v1/hlc-routes?action=stamp" | tr -d '[:space:]')
          RLIVE=$(curl -fsS "https://www.happylowcost.com/vuelos/feed.sha?t=$(date +%s)" | tr -d '[:space:]' || true)
          echo "new=$NEW live=$LIVE rutas=$R rlive=$RLIVE"
          if [ "$NEW" = "$LIVE" ] && [ "$R" = "$RLIVE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "go=no" >> $GITHUB_OUTPUT; else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.go == 'yes'
        with:
          ref: pub/happylowcost.com
          fetch-depth: 1
      - name: Generar páginas de chollos
        if: steps.chk.outputs.go == 'yes'
        run: |
          pip install --quiet Pillow
          python3 _hlc/gen_deals.py
          python3 _hlc/gen_en.py
          python3 _hlc/gen_routes.py
          python3 _hlc/gen_blog.py
          HLC_ONLY=vuelos python3 _hlc/build.py
          HLC_ONLY=chollos python3 _hlc/build.py
          HLC_ONLY=destinos python3 _hlc/build.py
          HLC_ONLY=blog python3 _hlc/build.py
          HLC_ONLY=buscar python3 _hlc/build.py
      - name: Comprobar (enlaces, códigos de Booking, mínimos)
        if: steps.chk.outputs.go == 'yes'
        run: python3 _hlc/check.py
      - name: Publicar
        if: steps.chk.outputs.go == 'yes'
        run: |
          git config user.name "happylowcost-bot"
          git config user.email "bot@happylowcost.com"
          git add -A index.html _redirects hlc/fx.json hlc/search-es.json hlc/search-en.json blog buscar hoteles chollos destinos en vuelos vuelos-sitemap.xml flights-sitemap.xml hlc/destinos.json hlc/img/cities chollos-sitemap.xml destinos-sitemap.xml sitemap_index.xml en-sitemap.xml 2>/dev/null || git add -A chollos destinos hlc/destinos.json hlc/img/cities chollos-sitemap.xml destinos-sitemap.xml sitemap_index.xml
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "chollos: actualización automática"
          for i in 1 2 3; do git push origin HEAD:pub/happylowcost.com && break; git fetch --depth=5 origin pub/happylowcost.com && git rebase -X theirs FETCH_HEAD; done
      - name: Avisar a buscadores (IndexNow)
        if: steps.chk.outputs.go == 'yes'
        continue-on-error: true
        run: |
          URLS=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^(chollos|en/deals|vuelos|en/flights)/[^/]+/index.html$' | sed 's#index.html$##; s#^#https://www.happylowcost.com/#' | head -500 | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          echo "$URLS" | head -c 300
          if [ "$URLS" != "[]" ]; then curl -sS -X POST https://api.indexnow.org/indexnow -H 'content-type: application/json' -d "{\"host\":\"www.happylowcost.com\",\"key\":\"dd9b8e6f028e89576c38388a0d7e3cd4\",\"keyLocation\":\"https://www.happylowcost.com/dd9b8e6f028e89576c38388a0d7e3cd4.txt\",\"urlList\":$URLS}" -w "\nindexnow %{http_code}\n"; fi
