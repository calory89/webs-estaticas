name: Kolaboro price index
# Daily: chained same-project index of advertised off-plan asking prices from the research agent's snapshots
# (tools/kolaboro-agent/data/runs), published to kolaboro.com/data/price-index.json. Aggregates only, no project ids or amounts.
on:
  schedule:
    - cron: '41 14 * * 3'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: kolaboro-price-index
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-agent
      - name: Build the index
        run: |
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          git show FETCH_HEAD:_s/kolaboro.com/data/price-reality.json > "$RUNNER_TEMP/price-reality.json" || true
          PRICE_REALITY_JSON="$RUNNER_TEMP/price-reality.json" python3 tools/kolaboro-agent/price_index.py "$RUNNER_TEMP/price-index.json"
      - name: Publish to kolaboro.com
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w "$RUNNER_TEMP/price-index.json")
            git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/price-index.json
            T=$(git write-tree); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: price index $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
