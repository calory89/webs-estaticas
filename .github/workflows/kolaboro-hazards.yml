name: Kolaboro natural hazards
# Monthly: natural hazards (height, flood model, earthquakes, tsunami run-ups, volcanoes, coastline) for every tracked project
# with coordinates and every satellite-watch area, published to kolaboro.com/data/hazards.json. Coordinates are never published.
on:
  schedule:
    - cron: '17 3 9 * *'
  push:
    branches: [main]
    paths: ['tools/kolaboro-hazards/**', '.github/workflows/kolaboro-hazards.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kolaboro-hazards
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-agent
            tools/kolaboro-hazards
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hazard code and public inputs from the live site branch
        run: |
          set -e
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          git show FETCH_HEAD:_worker.js/kbx_p_hz.js > "$RUNNER_TEMP/kbx_p_hz.mjs"
          git show FETCH_HEAD:_s/kolaboro.com/data/bali-cases.json > "$RUNNER_TEMP/cases.json"
          git show FETCH_HEAD:_s/kolaboro.com/data/satellite.json > "$RUNNER_TEMP/satellite.json"
          python3 tools/kolaboro-hazards/ids.py "$RUNNER_TEMP/ids.json"
      - name: Zoning services reachable from here?
        continue-on-error: true
        run: |
          for u in https://gistaru.atrbpn.go.id/robots.txt "https://gistaru.atrbpn.go.id/arcgis/rest/services?f=json" https://bhumi.atrbpn.go.id/robots.txt; do
            echo "$u -> $(curl -s -m 15 -o /dev/null -w '%{http_code} %{size_download}B' "$u" || echo failed)"; done
      - name: Read hazards
        run: node tools/kolaboro-hazards/run.mjs "$RUNNER_TEMP/kbx_p_hz.mjs" "$RUNNER_TEMP/ids.json" "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/satellite.json" "$RUNNER_TEMP/hazards.json"
      - name: Publish to kolaboro.com
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w "$RUNNER_TEMP/hazards.json")
            git update-index --add --cacheinfo 100644,$H,_s/kolaboro.com/data/hazards.json
            T=$(git write-tree); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: natural hazards $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
