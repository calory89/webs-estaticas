name: Kolaboro deploy guard
# After each push of kolaboro.com code to pub/_lovable: wait for the commit to be live, run the public smoke checks
# (kolaboro.com/open/deploy-smoke.mjs) and, if they fail twice, roll back the changed files. Record: kolaboro.com/data/deploys.json.
# Logic: kolaboro.com/open/deploy-guard.py (read from pub/_lovable at run time). The same file lives on main (schedule, manual drill)
# and on pub/_lovable (push trigger). Pushes made by other workflows do not trigger push runs, so the schedule catches those.
on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = guard the live commit; drill = prove the rollback path without pushing it'
        type: choice
        options: [drill, check]
        default: drill

permissions:
  contents: write
concurrency:
  group: kolaboro-deploy-guard-${{ github.event.inputs.mode || 'check' }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pub/_lovable
          fetch-depth: 300
          filter: blob:none
          sparse-checkout: _s/kolaboro.com/open
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Guard
        env:
          GUARD_MODE: ${{ github.event.inputs.mode || 'check' }}
          CF_PAGES_TOKEN: ${{ secrets.KB_CF_PAGES_ROLLBACK_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.KB_CF_ACCOUNT_ID }}
        run: |
          git config user.name "kolaboro deploy guard"; git config user.email "deploy-guard@kolaboro.com"
          git fetch -q --depth=300 --filter=blob:none origin +refs/heads/pub/_lovable:refs/remotes/origin/pub/_lovable
          git show origin/pub/_lovable:_s/kolaboro.com/open/deploy-guard.py > "$RUNNER_TEMP/deploy-guard.py"
          python3 "$RUNNER_TEMP/deploy-guard.py"
