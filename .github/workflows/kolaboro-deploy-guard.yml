name: Kolaboro deploy guard
# After each push of kolaboro.com code to pub/_lovable: wait for the commit to be live, run the public smoke checks
# (kolaboro.com/open/deploy-smoke.mjs) and, if they fail twice, roll back the changed files. Record: kolaboro.com/data/deploys.json.
# Logic: kolaboro.com/open/deploy-guard.py (read from pub/_lovable at run time). The same file lives on main (schedule, manual drill)
# and on pub/_lovable (push trigger). Pushes made by other workflows do not trigger push runs, so the schedule catches those.
on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = guard the live commit; drill = prove the rollback path without pushing it'
        type: choice
        options: [drill, check]
        default: drill

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-deploy-guard-${{ github.event.inputs.mode || 'check' }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: pub/_lovable
          fetch-depth: 300
          filter: blob:none
          sparse-checkout: _s/kolaboro.com/open
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Guard
        env:
          GUARD_MODE: ${{ github.event.inputs.mode || 'check' }}
          CF_PAGES_TOKEN: ${{ secrets.KB_CF_PAGES_ROLLBACK_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.KB_CF_ACCOUNT_ID }}
        run: |
          git config user.name "kolaboro deploy guard"; git config user.email "deploy-guard@kolaboro.com"
          git fetch -q --depth=300 --filter=blob:none origin +refs/heads/pub/_lovable:refs/remotes/origin/pub/_lovable
          git show origin/pub/_lovable:_s/kolaboro.com/open/deploy-guard.py > "$RUNNER_TEMP/deploy-guard.py"
          python3 "$RUNNER_TEMP/deploy-guard.py"
