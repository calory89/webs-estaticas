name: Kolaboro page history
# Every 6 hours: packs the developer page texts our agents archived (tools/kolaboro-agent/data/archive, by SHA-256) into
# kolaboro.com/data/page-history-{0,1,2}.json for the "what changed" viewer on named project pages (/projects/<slug>/changes/).
# No model calls, no cost: it only reads files already in this repository. Public named projects only (no Sumba: conflict of interest).
on:
  schedule:
    - cron: '52 5 * * *'   # daily: 0.50 USD/day budget, 9 Nov 2026
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-page-history
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/kolaboro-agent
            tools/kolaboro-reliability
      - name: Build
        run: |
          curl -fsS --retry 3 https://kolaboro.com/data/named.json -o "$RUNNER_TEMP/named.json"
          python3 tools/kolaboro-agent/page_history.py "$RUNNER_TEMP/named.json" "$RUNNER_TEMP/ph"
          ls -la "$RUNNER_TEMP/ph"
      - name: Publish to kolaboro.com
        run: |
          bash tools/kolaboro-reliability/publish.sh "kolaboro.com: developer page history $(date -u +%FT%H:%MZ)" \
            "$RUNNER_TEMP/ph/page-history-0.json=_s/kolaboro.com/data/page-history-0.json" \
            "$RUNNER_TEMP/ph/page-history-1.json=_s/kolaboro.com/data/page-history-1.json" \
            "$RUNNER_TEMP/ph/page-history-2.json=_s/kolaboro.com/data/page-history-2.json"
