name: Kolaboro open history
# n18e (batch 18, 8 Nov 2026): keeps the weekly history of kolaboro.com/open (/data/traction.json on pub/_lovable) up to date on its own.
# Daily, it reads the public JSON https://kolaboro.com/api/x/fc/open (computed by the worker from public aggregate functions only,
# no keys, no personal data) and freezes the closed weeks that the worker can count exactly ("history_update": sealed X-rays and
# Bitcoin stamps per week) into /data/traction.json, then advances "complete_until" per series. Nothing is written when nothing changed.
# X-ray runs per week have no public source and keep their last value from the claude-ops snapshot (marked partial on /open).
# Developer answer speed needs no job: /data/dev-response.json is served live by the worker.
# n26y (batch 26, 13 Nov 2026): a second step records the figures of kolaboro.com/progress/ that cannot be rebuilt later from other
# files (sources cited, claims tested, URLs in the sitemaps, totals) as one row per UTC day in /data/progress.json "days", read from
# the public JSON https://kolaboro.com/api/x/progress/today (counts only). Same budget gate and job; a few seconds.
on:
  schedule:
    - cron: '41 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-open-history
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/workflows
      - name: Merge closed weeks into traction.json and publish
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          K=_s/kolaboro.com/data/traction.json
          curl -sSf --retry 3 -H 'user-agent: kolaboro-open-history (GitHub Actions)' "https://kolaboro.com/api/x/fc/open?h=$(date +%s)" -o $RUNNER_TEMP/open.json
          for i in 1 2 3 4 5; do
            git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
            P=$(git rev-parse FETCH_HEAD)
            git show FETCH_HEAD:$K > $RUNNER_TEMP/tr.json
            python3 - "$RUNNER_TEMP/open.json" "$RUNNER_TEMP/tr.json" "$RUNNER_TEMP/new.json" <<'PY'
          import json, sys, datetime
          o, t = json.load(open(sys.argv[1])), json.load(open(sys.argv[2]))
          hu = o.get('history_update') or {}
          cu_new = hu.get('complete_until') or {}
          cu = dict(t.get('complete_until') or {})
          changed = False
          for k in ('xrays_sealed', 'bitcoin_stamps'):
              lim = cu_new.get(k)
              if not lim: continue
              ser = dict((w, n) for w, n in (t.get('series', {}).get(k) or []))
              for w, n in hu.get(k) or []:
                  if w < lim and isinstance(n, int) and ser.get(w) != n: ser[w] = n; changed = True
              if lim > cu.get(k, '') and all(w in ser for w in [x for x, _ in hu.get(k) or []] if w < lim): cu[k] = lim; changed = True
              t.setdefault('series', {})[k] = sorted(ser.items())[-104:]
          if changed:
              t['complete_until'] = cu
              t['updated'] = datetime.datetime.utcnow().replace(microsecond=0).isoformat() + 'Z'
              t['history_job'] = '.github/workflows/kolaboro-open-history.yml on main: daily, closed weeks from https://kolaboro.com/api/x/fc/open (public aggregate functions only)'
          if changed: json.dump(t, open(sys.argv[3], 'w'), ensure_ascii=False)
          else: open(sys.argv[3], 'w').write(open(sys.argv[2]).read())
          print('changed' if changed else 'no change', json.dumps(cu))
          PY
            cmp -s $RUNNER_TEMP/tr.json $RUNNER_TEMP/new.json && { echo "no change"; exit 0; }
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" $RUNNER_TEMP/new.json
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w $RUNNER_TEMP/new.json); git update-index --add --cacheinfo 100644,$H,$K
            T=$(git write-tree --missing-ok); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: /open weekly history $(date -u +%F) (closed weeks from public aggregates)")
            git push -q origin $C:refs/heads/pub/_lovable && { echo "published $C"; exit 0; }
            sleep 5
          done; exit 1
      - name: Daily record of the progress figures (/data/progress.json "days")
        if: ${{ !cancelled() }}
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          K=_s/kolaboro.com/data/progress.json
          curl -sSf --retry 3 --max-time 60 -H 'user-agent: kolaboro-open-history (GitHub Actions)' "https://kolaboro.com/api/x/progress/today?h=$(date +%s)" -o $RUNNER_TEMP/today.json
          for i in 1 2 3 4 5; do
            git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
            P=$(git rev-parse FETCH_HEAD)
            git show FETCH_HEAD:$K > $RUNNER_TEMP/pg.json
            python3 - "$RUNNER_TEMP/today.json" "$RUNNER_TEMP/pg.json" "$RUNNER_TEMP/pg-new.json" <<'PY'
          import json, sys, re
          o, p = json.load(open(sys.argv[1])), json.load(open(sys.argv[2]))
          if not re.match(r'^\d{4}-\d{2}-\d{2}$', str(o.get('d') or '')): sys.exit('bad snapshot')
          row = {'d': o['d'], 'at': o.get('at')}
          for k in ('projects', 'markets', 'countries', 'sources', 'claims_total', 'data_points', 'sitemap_urls'):
              if isinstance(o.get(k), int) and o[k] >= 0: row[k] = o[k]
          days = [r for r in (p.get('days') or []) if r.get('d') != row['d']] + [row]
          p['days'] = sorted(days, key=lambda r: r['d'])[-400:]
          json.dump(p, open(sys.argv[3], 'w'), ensure_ascii=False, separators=(',', ':'))
          print('row', json.dumps(row))
          PY
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" $RUNNER_TEMP/pg-new.json
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx2; rm -f $GIT_INDEX_FILE; git read-tree $P
            H=$(git hash-object -w $RUNNER_TEMP/pg-new.json); git update-index --add --cacheinfo 100644,$H,$K
            T=$(git write-tree --missing-ok); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: /progress/ daily record $(date -u +%F) (public counts from /api/x/progress/today)")
            git push -q origin $C:refs/heads/pub/_lovable && { echo "published $C"; exit 0; }
            sleep 5
          done; exit 1
