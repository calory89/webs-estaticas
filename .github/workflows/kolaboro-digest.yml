name: Kolaboro weekly digest
# Weekly market digest (/digest/, /digest/<yyyy-ww>/, /digest/feed.xml) and change heatmap (/changes/), block X6.
# Built from the public /data/ files of kolaboro.com and their git history on pub/_lovable (GitHub API, one copy per day).
# claude-sonnet-5-5 may draft the intro paragraph only; code checks every number in it against the counts, else a template is used.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      no_ai:
        description: "Skip the AI intro (yes/no)"
        default: "no"
      rebuild:
        description: "Rebuild finished weeks too (yes/no)"
        default: "no"

permissions:
  contents: write
  actions: write
concurrency:
  group: kolaboro-digest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kolaboro budget gate (max 80 Actions minutes a day, about 0.50 USD)
        env:
          GH_TOKEN: ${{ github.token }}
          KB_DAILY_MIN: '80'
        run: |
          # Owner rule (9 Nov 2026): all Kolaboro workflows together spend at most 0.50 USD a day (80 min at 0.006 USD/min).
          # Counts today's (UTC) job minutes of every "Kolaboro ..." run, rounded up per job like GitHub bills them.
          # Over the cap: cancel this run. Under it: a watchdog cancels this run when the rest of the day's budget is used.
          T=$(date -u +%F); used=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=%3E%3D$T&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.name | startswith("Kolaboro")) | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            m=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
              '[.jobs[] | select(.started_at != null) | ((((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | ceil)] | add // 0' || echo 0)
            used=$((used + m))
          done
          left=$((KB_DAILY_MIN - used - 1))
          echo "Kolaboro Actions minutes used today: $used of $KB_DAILY_MIN"
          if [ "$left" -le 0 ]; then
            echo "::notice::Daily Kolaboro budget reached ($used min). Cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 60; exit 1
          fi
          echo "Watchdog: this run may use $left more minutes today."
          nohup setsid bash -c "sleep $((left * 60)); gh run cancel $GITHUB_RUN_ID -R $GITHUB_REPOSITORY" >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/kolaboro-digest
      - name: Build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          I=$RUNNER_TEMP/in; O=$RUNNER_TEMP/out; mkdir -p $I $O
          K=_s/kolaboro.com
          git show FETCH_HEAD:$K/promises/index.html > $I/shell.html
          git show FETCH_HEAD:$K/digest/index.html > $I/digest.json 2>/dev/null || true   # the data rides inside the page (digest-data)
          F=""; [ "${{ github.event.inputs.no_ai }}" = "yes" ] && F="--no-ai"; [ "${{ github.event.inputs.rebuild }}" = "yes" ] && F="$F --rebuild"
          python3 tools/kolaboro-digest/digest.py --repo ${{ github.repository }} --shell $I/shell.html --prev $I/digest.json --out $O --cache $RUNNER_TEMP/cache $F | tee $RUNNER_TEMP/summary.json
          echo '### Weekly digest' >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; cat $RUNNER_TEMP/summary.json >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Publish to kolaboro.com
        run: |
          set -e
          git config user.name "kolaboro-agent"; git config user.email "agent@kolaboro.com"
          O=$RUNNER_TEMP/out; K=_s/kolaboro.com
          git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          for i in 1 2 3 4 5; do
            P=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE=$RUNNER_TEMP/idx; rm -f $GIT_INDEX_FILE; git read-tree $P
            (cd $O && find digest -type f) | while read f; do
              H=$(git hash-object -w "$O/$f"); git update-index --add --cacheinfo 100644,$H,$K/$f
            done
            T=$(git write-tree --missing-ok); unset GIT_INDEX_FILE
            [ "$(git rev-parse $P^{tree})" = "$T" ] && { echo "no change"; exit 0; }
            C=$(git commit-tree $T -p $P -m "kolaboro.com: weekly digest and change heatmap $(date -u +%F)")
            git push -q origin $C:refs/heads/pub/_lovable && exit 0
            sleep 5; git fetch -q --depth=1 --filter=blob:none origin pub/_lovable
          done; exit 1
