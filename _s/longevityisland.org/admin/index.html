<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications · Longevity Island admin</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Gloock';src:url(/fonts2/Gloock-1-latin.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:300 600;src:url(/fonts2/HankenGrotesk-3-latin.woff2) format('woff2')}
:root{--paper:#f3f5f2;--paper-2:#e7ece8;--ink:#0f2126;--muted:#56676b;--line:rgba(15,33,38,.14);--red:#c8102e;--lagoon:#117270}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0c1618;--paper-2:#122124;--ink:#e9efec;--muted:#9aaaa9;--line:rgba(233,239,236,.14);--red:#ff5468;--lagoon:#5cc8c4;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 'Hanken Grotesk',Arial,sans-serif;padding:20px 16px 60px}
h1{font-family:Gloock,Georgia,serif;font-weight:400;font-size:1.9rem;margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto 18px}
.box{max-width:1400px;margin:0 auto}
.login{max-width:420px;margin:12vh auto 0;background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:24px}
input,select,button{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px}
button{cursor:pointer;font-weight:600}
.btn{background:var(--red);border-color:var(--red);color:#fff}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:Gloock,Georgia,serif;font-weight:400;font-size:1.8rem;line-height:1.1}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.countries{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.countries span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
.wrapt{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:var(--paper-2);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
tr:hover td{background:color-mix(in srgb,var(--paper-2) 60%,transparent)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;border:1px solid var(--line)}
.very{background:#c8102e;color:#fff;border-color:#c8102e}.interested{background:#117270;color:#fff;border-color:#117270}
a{color:var(--lagoon)}
.err{color:var(--red)}
</style>
</head>
<body>
<div id="loginBox" class="login" hidden>
  <h1>Longevity Island</h1>
  <p class="muted">Internal page. Enter the admin key.</p>
  <form id="lf"><input id="key" type="password" autocomplete="current-password" placeholder="Admin key" style="width:100%"><p><button class="btn" type="submit">Open</button></p><p id="lerr" class="err" hidden></p></form>
</div>

<div id="app" hidden>
  <div class="top">
    <div><h1>Applications</h1><span class="muted" id="sub"></span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="reload" type="button">Refresh</button><button id="csv" type="button">Download CSV</button><button id="out" type="button">Log out</button></div>
  </div>
  <div class="box">
    <div class="stats" id="stats"></div>
    <div class="countries" id="countries"></div>
    <div class="filters">
      <input id="q" placeholder="Search name, email, WhatsApp" style="min-width:240px">
      <select id="fc"><option value="">All countries</option></select>
      <select id="fi"><option value="">All interest</option><option value="very">Very interested</option><option value="interested">Interested</option><option value="curious">Curious</option></select>
      <select id="fs"><option value="">All statuses</option><option>new</option><option>contacted</option><option>accepted</option><option>waitlist</option><option>declined</option></select>
    </div>
    <div class="wrapt"><table><thead><tr>
      <th data-k="created_at">Date</th><th data-k="name">Name</th><th data-k="age">Age</th><th data-k="country">Country</th><th data-k="interest">Interest</th><th data-k="active">Active</th><th data-k="smoker">Smoker</th><th>Email</th><th>WhatsApp</th><th data-k="utm_content">Source</th><th data-k="status">Status</th>
    </tr></thead><tbody id="tb"></tbody></table></div>
    <p class="muted" id="empty" hidden>No applications yet.</p>
  </div>
</div>

<script>
(function(){
  var FN = 'https://oykcsmextclpdnugixqz.supabase.co/functions/v1/li-admin';
  var key = ''; try { key = sessionStorage.getItem('li_admin') || ''; } catch(e){}
  var rows = [], sortK = 'created_at', sortD = -1;
  var $ = function(id){ return document.getElementById(id); };
  var L = { very:'Very interested', interested:'Interested', curious:'Curious', some:'Somewhat', no:'No', quit:'Quit', yes:'Yes' };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function api(method, body){ return fetch(FN, { method:method, headers:{ 'x-admin-key':key, 'content-type':'application/json' }, body: body ? JSON.stringify(body) : undefined }).then(function(r){ return r.json().then(function(j){ j._status = r.status; return j; }); }); }
  function showLogin(msg){ $('app').hidden = true; $('loginBox').hidden = false; if (msg){ $('lerr').hidden = false; $('lerr').textContent = msg; } }
  function load(){
    api('GET').then(function(j){
      if (j._status === 401) { key=''; try{sessionStorage.removeItem('li_admin')}catch(e){} return showLogin('Wrong key.'); }
      if (j._status === 503) return showLogin('The admin key has not been set up yet (secret LI_ADMIN_KEY in Supabase).');
      if (!j.rows) return showLogin('Could not load applications. Try again.');
      rows = j.rows; $('loginBox').hidden = true; $('app').hidden = false; render();
    }).catch(function(){ showLogin('Network error. Try again.'); });
  }
  function filtered(){
    var q = $('q').value.trim().toLowerCase(), c = $('fc').value, i = $('fi').value, s = $('fs').value;
    return rows.filter(function(r){
      if (c && r.country !== c) return false; if (i && r.interest !== i) return false; if (s && r.status !== s) return false;
      if (q && ![r.name, r.email, r.whatsapp].join(' ').toLowerCase().includes(q)) return false; return true;
    }).sort(function(a,b){ var x = a[sortK], y = b[sortK]; if (x == null) x = ''; if (y == null) y = ''; return (x > y ? 1 : x < y ? -1 : 0) * sortD; });
  }
  function render(){
    var by = {}, ints = {very:0, interested:0, curious:0}, week = 0, now = Date.now();
    rows.forEach(function(r){ by[r.country||'?'] = (by[r.country||'?']||0) + 1; if (ints[r.interest] != null) ints[r.interest]++; if (now - new Date(r.created_at) < 7*864e5) week++; });
    $('sub').textContent = rows.length + ' total · updated ' + new Date().toLocaleTimeString();
    $('stats').innerHTML = [['Total', rows.length], ['Last 7 days', week], ['Very interested', ints.very], ['Interested', ints.interested], ['Curious', ints.curious], ['Countries', Object.keys(by).length]].map(function(s){ return '<div class="stat"><span class="muted">'+s[0]+'</span><b>'+s[1]+'</b></div>'; }).join('');
    var cs = Object.keys(by).sort(function(a,b){ return by[b]-by[a]; });
    $('countries').innerHTML = cs.map(function(c){ return '<span>'+esc(c)+' · '+by[c]+'/65</span>'; }).join('');
    var fc = $('fc'), cur = fc.value; fc.innerHTML = '<option value="">All countries</option>' + cs.map(function(c){ return '<option>'+esc(c)+'</option>'; }).join(''); fc.value = cur;
    var list = filtered();
    $('empty').hidden = rows.length > 0;
    $('tb').innerHTML = list.map(function(r){
      var wa = String(r.whatsapp||'').replace(/[^0-9]/g,'');
      var src = [r.utm_source, r.utm_campaign, r.utm_content].filter(Boolean).join(' / ');
      return '<tr><td>'+esc(new Date(r.created_at).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'}))+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.age)+'</td><td>'+esc(r.country)+'</td>'+
        '<td><span class="pill '+esc(r.interest)+'">'+esc(L[r.interest]||r.interest)+'</span></td><td>'+esc(L[r.active]||(r.active==='very'?'Very':r.active))+'</td><td>'+esc(L[r.smoker]||r.smoker)+'</td>'+
        '<td><a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></td><td>'+(wa?'<a href="https://wa.me/'+wa+'" target="_blank" rel="noopener">'+esc(r.whatsapp)+'</a>':'')+'</td><td class="muted">'+esc(src)+'</td>'+
        '<td><select data-id="'+esc(r.id)+'">'+['new','contacted','accepted','waitlist','declined'].map(function(s){ return '<option'+(s===r.status?' selected':'')+'>'+s+'</option>'; }).join('')+'</select></td></tr>';
    }).join('');
  }
  $('tb').addEventListener('change', function(e){
    var s = e.target; if (s.tagName !== 'SELECT') return; s.disabled = true;
    api('POST', { id:s.dataset.id, status:s.value }).then(function(j){ if (j.ok){ rows.forEach(function(r){ if (r.id === s.dataset.id) r.status = s.value; }); } else alert('Could not save the status.'); }).finally(function(){ s.disabled = false; });
  });
  ['q','fc','fi','fs'].forEach(function(id){ $(id).addEventListener('input', render); });
  document.querySelectorAll('th[data-k]').forEach(function(th){ th.onclick = function(){ var k = th.dataset.k; sortD = sortK === k ? -sortD : 1; sortK = k; render(); }; });
  $('reload').onclick = load;
  $('out').onclick = function(){ key=''; try{sessionStorage.removeItem('li_admin')}catch(e){} showLogin(''); };
  $('csv').onclick = function(){
    var cols = ['created_at','name','age','country','interest','active','smoker','email','whatsapp','status','utm_source','utm_campaign','utm_content'];
    var lines = [cols.join(',')].concat(filtered().map(function(r){ return cols.map(function(c){ return '"' + String(r[c]==null?'':r[c]).replace(/"/g,'""') + '"'; }).join(','); }));
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv'})); a.download = 'longevity-island-applications.csv'; a.click();
  };
  $('lf').addEventListener('submit', function(e){ e.preventDefault(); key = $('key').value.trim(); if (!key) return; try{sessionStorage.setItem('li_admin', key)}catch(_){} $('lerr').hidden = true; load(); });
  if (key) load(); else showLogin('');
})();
</script>
</body>
</html>
