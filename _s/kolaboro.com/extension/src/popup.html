<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kolaboro</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <img src="icons/icon32.png" width="24" height="24" alt="">
  <span class="brand">kolaboro</span>
  <span class="tag">Off-plan check</span>
</header>

<section class="card">
  <p class="lbl" id="uLbl">This page</p>
  <p class="url" id="url" aria-labelledby="uLbl">Reading the current tab...</p>
  <button class="go" id="go" type="button" disabled>Check this project</button>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</section>

<section class="list" aria-labelledby="clT">
  <h2 id="clT">Can you see these on the page? <span id="count">0 of 6</span></h2>
  <ul id="cl">
    <li><label><input type="checkbox" data-k="permit"><span><b>Permit number</b> A building permit or licence number you can look up.</span></label></li>
    <li><label><input type="checkbox" data-k="escrow"><span><b>Deposit protection</b> Your money held in escrow or a protected account.</span></label></li>
    <li><label><input type="checkbox" data-k="progress"><span><b>Construction progress</b> Dated photos or reports from the site.</span></label></li>
    <li><label><input type="checkbox" data-k="plans"><span><b>Plans</b> Floor plans and a specification, not only renders.</span></label></li>
    <li><label><input type="checkbox" data-k="record"><span><b>Track record</b> Earlier projects by the same developer, finished.</span></label></li>
    <li><label><input type="checkbox" data-k="returns"><span><b>No guaranteed returns</b> No promised yield or fixed rental income.</span></label></li>
  </ul>
  <p class="hint" id="hint">Each missing item is a question to ask before you pay anything.</p>
</section>

<footer class="foot">
  <a href="https://kolaboro.com/database" data-ext>The database</a>
  <a href="https://kolaboro.com/cases" data-ext>Live cases</a>
  <a href="https://kolaboro.com/extension/#privacy" data-ext>Privacy</a>
</footer>
<script src="popup.js"></script>
</body>
</html>
