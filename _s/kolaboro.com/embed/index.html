<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transparency Index widget | Kolaboro</title>
<meta name="description" content="Embeddable Off-plan Transparency Index card for one market, with live data from Kolaboro.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://kolaboro.com/transparency-index/">
<link rel="icon" href="/k/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/k/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/k/fonts/archivo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/k/fonts/archivo-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+A720-A7FF}
:root{--ink:#17212B;--muted:#59626B;--line:rgba(23,33,43,.14);--hivis:#FF5B14;--hivis-ink:#B83A05;--ok:#0B7A55;--track:#E8E7E2;--bg:#fff;--card:#F6F6F3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.w{width:100%;min-height:300px;max-height:320px;height:100vh;max-width:100%;padding:16px 18px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.eb{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;color:var(--hivis-ink);margin:0}
.dt{white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px}
h1{font-size:clamp(1.3rem,6vw,1.9rem);font-stretch:118%;font-weight:850;letter-spacing:-.025em;line-height:1;margin:0;overflow-wrap:anywhere}
.ct{display:block;font-size:.85rem;color:var(--muted);margin-top:4px}
.ix{text-align:right;flex:none}
.ix b{display:block;font-size:clamp(2.2rem,10vw,3rem);font-stretch:112%;font-weight:850;letter-spacing:-.03em;line-height:.9}
.ix span{font-size:.78rem;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--track);margin-top:12px}
.bar i{display:block;height:100%}.bd{background:var(--ink)}.bv{background:var(--ok)}.bf{background:var(--hivis)}
.rk{font-size:.86rem;margin-top:8px}.rk b{font-weight:800}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.st div{background:var(--bg);padding:8px 10px}
.st b{display:block;font-size:1.25rem;font-stretch:112%;font-weight:800;line-height:1.1}
.st span{display:block;font-size:.72rem;color:var(--muted);line-height:1.25;margin-top:2px}
.ft{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.ft a{color:var(--ink);font-weight:750;text-decoration:underline;text-underline-offset:2px;padding:6px 0}
.ft a:focus-visible,.msg a:focus-visible{outline:3px solid var(--hivis);outline-offset:2px;border-radius:3px}
.brand{display:inline-flex;align-items:center;gap:6px}.brand svg{width:16px;height:16px}
.msg{margin:auto 0;font-size:.95rem}.msg a{color:var(--ink);font-weight:750}
.sk{background:linear-gradient(90deg,var(--track),#F1F0EC,var(--track));border-radius:6px;color:transparent}
@media(max-width:340px){.st span{font-size:.66rem}.w{padding:12px}}
</style>
</head>
<body>
<div class="w" id="w" aria-live="polite">
 <p class="eb">Off-plan Transparency Index</p>
 <div class="hd"><h1><span class="sk" id="mk">Loading market</span><span class="ct" id="ct"></span></h1><div class="ix"><b id="ix" class="sk">00</b><span>out of 100</span></div></div>
 <div class="bar" id="bar" aria-hidden="true"></div>
 <p class="rk" id="rk"></p>
 <div class="st">
  <div><b id="s-p">&nbsp;</b><span>projects tracked</span></div>
  <div><b id="s-permit">&nbsp;</b><span>permit public</span></div>
  <div><b id="s-esc">&nbsp;</b><span>deposit protection</span></div>
 </div>
 <div class="ft"><span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4v24M8 16 23 6.5M8 16l15 9.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="24" cy="6" r="3.4" fill="currentColor"/><circle cx="24" cy="26" r="3.4" fill="currentColor"/><circle cx="8" cy="16" r="4.2" fill="#FF5B14"/></svg><span>Data: <a id="src" href="/transparency-index/" target="_blank" rel="noopener">Kolaboro</a><span class="dt" id="dt"></span></span></span><a id="how" href="/transparency-index/#method" target="_blank" rel="noopener">Method</a></div>
</div>
<script src="/transparency-index/ti-core.js?v=835cf5a007"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i);}, K=window.KTI, w=$('w');
  var m=''; try{ m=(new URLSearchParams(location.search).get('m')||'').trim(); }catch(e){}
  function fail(html){ w.innerHTML='<p class="eb">Off-plan Transparency Index</p><p class="msg">'+html+'</p><div class="ft"><span>Data: <a href="/transparency-index/" target="_blank" rel="noopener">Kolaboro</a></span></div>'; }
  if(!K){ fail('The widget could not load.'); return; }
  fetch(K.dataUrl()).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
    var R=K.compute(d), lc=m.toLowerCase();
    var r=R.rows.filter(function(x){ return x.market.toLowerCase()===lc; })[0];
    if(!m){ fail('Add a market to the address, for example <a href="?m=Bali">?m=Bali</a>. See all markets in the <a href="/transparency-index/" target="_blank" rel="noopener">Transparency Index</a>.'); return; }
    if(!r){ fail('<b>'+K.esc(m)+'</b> is not in the index. Markets need at least 3 tracked projects. See the <a href="/transparency-index/" target="_blank" rel="noopener">full ranking</a>.'); return; }
    document.title=r.market+': Transparency Index '+r.index.toFixed(1)+' | Kolaboro';
    $('mk').textContent=r.market; $('mk').className=''; $('ct').textContent=r.country.toLowerCase()===r.market.toLowerCase()?'':r.country;
    $('ix').textContent=r.index.toFixed(1); $('ix').className='';
    $('bar').innerHTML='<i class="bd" style="width:'+r.pD.toFixed(2)+'%"></i><i class="bv" style="width:'+r.pV.toFixed(2)+'%"></i><i class="bf" style="width:'+r.pF.toFixed(2)+'%"></i>';
    $('rk').innerHTML='Rank <b>'+r.rank+'</b> of '+R.rows.length+' markets';
    $('s-p').textContent=r.projects; $('s-permit').textContent=K.pct(r.permitP); $('s-esc').textContent=K.pct(r.escrowP);
    $('dt').textContent=', '+K.fmtDate(R.updated);
  }).catch(function(){ fail('The data could not load. See the <a href="/transparency-index/" target="_blank" rel="noopener">Transparency Index</a>.'); });
})();
</script>
</body>
</html>
