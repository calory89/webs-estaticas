<script>document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-print]');if(b){e.preventDefault();window.print()}});

(function(){
  var SB = 'https://oykcsmextclpdnugixqz.supabase.co/rest/v1/rpc/kolaboro_shared', K = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95a2NzbWV4dGNscGRudWdpeHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTMzNjYsImV4cCI6MjEwNzk2OTM2Nn0.n4lmkzPgZe64B18altwRMYFiQrLQ2Quqg9uV9SoJhAw';
  var STAGES = ['Case opened','Documents','Land & title','Building permit','Site visit','Report'];
  var VERD = { pending:['In progress','pending'], safe:['No red flags','safe'], hold:['Hold payments','hold'], stop:["Don't pay yet",'stop'] };
  var app = document.getElementById('app');
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function surl(u){ u = String(u || ''); return /^https:\/\//i.test(u) ? esc(u) : ''; }
  function fmt(t){ if (!t) return ''; return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); }
  function fail(t){ app.innerHTML = '<div class="ap-card ap-empty"><h2>' + t + '</h2><p>Ask the person who sent you this link for a new one. Links expire, and the owner can switch them off at any time.</p><p><a href="/">What is Kolaboro?</a></p></div>'; }
  var m = location.hash.match(/t=([a-f0-9]{20,80})/);
  if (!m) { fail('This link is incomplete'); return; }
  fetch(SB, { method: 'POST', headers: { apikey: K, Authorization: 'Bearer ' + K, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: m[1] }) }).then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.case) { fail('This link is no longer active'); return; }
    var c = d.case, v = VERD[c.verdict] || VERD.pending, st = c.stage || 0, r = c.desk && c.desk.report;
    var steps = STAGES.map(function(s, i){ var l = (c.log || []).filter(function(x){ return x.stage === i; })[0]; return '<li class="' + ((i < st || (i === 5 && c.report_url)) ? 'done' : i === st ? 'now' : '') + '">' + s + '<small>' + (l ? fmt(l.at) : '') + '</small></li>'; }).join('');
    var h = '<div class="ap-banner ok" style="display:block">Shared with you' + (d.label ? ' as <b>' + esc(d.label) + '</b>' : '') + '. Read-only view of a Kolaboro case, valid until ' + fmt(d.expires) + '. It does not include the buyer\'s messages or contact details.</div>';
    h += '<section class="ap-card ap-hero"><p class="ap-k">Case ' + esc(c.code) + ' · opened ' + fmt(c.created_at) + '</p><h1>' + esc(c.project_name || (c.project_url || 'Project').replace(/^https?:\/\/(www\.)?/, '')) + '</h1><p style="margin:0;color:#C9D0D6;position:relative;z-index:1">' + esc([c.developer, c.location, c.price_text].filter(Boolean).join(' · ')) + (surl(c.project_url) ? ([c.developer, c.location, c.price_text].some(Boolean) ? ' · ' : '') + '<a href="' + surl(c.project_url) + '" target="_blank" rel="noopener noreferrer">website ↗</a>' : '') + '</p>' +
      '<div class="ap-badges"><span class="ap-badge ' + v[1] + '">' + v[0] + '</span>' + (c.paid ? '' : '<span class="ap-badge hold">Check not started</span>') + (c.eta && st < 5 ? '<span class="ap-badge">Report due ' + fmt(c.eta) + '</span>' : '') + '</div><ol class="ap-steps">' + steps + '</ol>' + (c.stage_note ? '<div class="ap-now"><span class="ap-k">Now</span><div style="margin-top:4px">' + esc(c.stage_note) + '</div></div>' : '') + '</section>';
    h += '<section class="ap-card"><h2>Report</h2>' + (surl(c.report_url) ? '<p>Verdict: <b>' + v[0] + '</b></p><a class="ap-btn" href="' + surl(c.report_url) + '" target="_blank" rel="noopener noreferrer">Open the report</a>' : '<p class="ap-muted">Not ready yet.' + (c.eta ? ' Due ' + fmt(c.eta) + '.' : '') + '</p>') + '</section>';
    if ((c.schedule || []).length) h += '<section class="ap-card"><h2>Payment schedule</h2><table class="sh-t"><tr><th>Instalment</th><th>Due</th><th>Amount</th><th>Tied to</th><th>Status</th></tr>' + c.schedule.map(function(p){ return '<tr class="' + (p.paid ? 'pd' : '') + '"><td>' + esc(p.label) + '</td><td>' + fmt(p.due) + '</td><td>' + esc(p.amount || '') + '</td><td>' + esc(p.milestone || '') + '</td><td>' + (p.paid ? 'Paid' : 'Open') + '</td></tr>'; }).join('') + '</table></section>';
    if (r) h += '<section class="ap-card"><h2>Desk review of the developer\'s website</h2><p>' + esc(r.summary) + '</p>' + ((r.questions || []).length ? '<h3>Open questions</h3><ol class="ap-list">' + r.questions.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>' : '') + '<p class="ap-small ap-muted">Advertised claims, not verified facts.</p></section>';
    h += '<section class="ap-card"><h2>Timeline</h2><ul class="ap-tl">' + (c.log || []).slice().reverse().map(function(l){ return '<li><b>' + STAGES[l.stage] + '</b><div class="ap-small ap-muted">' + fmt(l.at) + '</div>' + (l.note ? '<div>' + esc(l.note) + '</div>' : '') + '</li>'; }).join('') + '</ul></section>';
    h += '<p class="ap-small ap-muted sh-np">Kolaboro checks off-plan property for buyers before each payment. <a href="/">How it works</a>.</p>';
    app.innerHTML = h;
  }).catch(function(){ fail('Could not load this case. Try again in a moment.'); });
})();
