      (function () {
        try {

          try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
          try { s = localStorage.getItem("ebc-site-lang"); } catch (e) {}
          if (ok(q)) { L = q; try { localStorage.setItem("ebc-site-lang", q); } catch (e) {} }
          else if (ok(s)) { L = s; }
          else {
            var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
            var nav = ""; try { nav = navigator.language || ""; } catch (e) {}
            var re = /^(Europe\/Madrid|Atlantic\/Canary|Africa\/Ceuta|Pacific\/Galapagos|Pacific\/Easter|America\/(Mexico_City|Cancun|Merida|Monterrey|Matamoros|Chihuahua|Ciudad_Juarez|Ojinaga|Mazatlan|Bahia_Banderas|Hermosillo|Tijuana|Guatemala|El_Salvador|Tegucigalpa|Managua|Costa_Rica|Panama|Havana|Santo_Domingo|Puerto_Rico|Bogota|Caracas|Guayaquil|Lima|La_Paz|Santiago|Punta_Arenas|Asuncion|Montevideo|Buenos_Aires|Cordoba|Mendoza|Argentina\/.+))$/;

              ["it", /^Europe\/(Rome|San_Marino|Vatican)$/, /^it\b/i],
              ["ja", /^Asia\/Tokyo$/, /^ja\b/i],
              ["zh", /^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar)$/, /^zh(-(CN|Hans|SG))?\b/i],
              ["ru", /^(Europe\/(Moscow|Kaliningrad|Samara|Volgograd|Saratov|Ulyanovsk|Astrakhan|Kirov|Minsk)|Asia\/(Yekaterinburg|Omsk|Novosibirsk|Barnaul|Tomsk|Novokuznetsk|Krasnoyarsk|Irkutsk|Chita|Yakutsk|Khandyga|Vladivostok|Ust-Nera|Magadan|Sakhalin|Srednekolymsk|Kamchatka|Anadyr))$/, /^ru\b/i],
              ["ar", /^(Asia\/(Riyadh|Dubai|Qatar|Kuwait|Bahrain|Muscat|Amman|Beirut|Baghdad|Aden|Damascus|Gaza|Hebron)|Africa\/(Cairo|Casablanca|Algiers|Tunis|Tripoli|Khartoum|El_Aaiun|Nouakchott))$/, /^ar\b/i],

              ["de", /^Europe\/(Berlin|Vienna|Zurich|Busingen|Vaduz|Luxembourg)$/, /^de\b/i],
              ["fr", /^(Europe\/(Paris|Brussels|Luxembourg|Monaco|Zurich)|America\/(Montreal|Toronto))$/, /^fr\b/i],
              ["id", /^Asia\/(Jakarta|Pontianak|Makassar|Jayapura)$/, /^(id|in)\b/i],
              ["nl", /^Europe\/(Amsterdam|Brussels)$/, /^nl\b/i],
              ["pl", /^Europe\/Warsaw$/, /^pl\b/i],
              ["da", /^(Europe\/Copenhagen|Atlantic\/Faroe|America\/Nuuk)$/, /^da\b/i],
              ["sk", /^Europe\/Bratislava$/, /^sk\b/i]
            ];
            if (re.test(tz)) L = "es";
            else for (var i = 0; i < auto.length; i++) if (auto[i][1].test(tz) && auto[i][2].test(nav)) { L = auto[i][0]; break; }
          }
          window.__ebcLang = L;
          if (L !== "en") {
            if (L === "es") { try { if (!localStorage.getItem("ebc_portal_lang")) localStorage.setItem("ebc_portal_lang", "es"); } catch (e) {} }
            if (!/^\/(investor|admin)(\/|$)/.test(location.pathname)) {

              document.head.appendChild(l3);
              setTimeout(function () { h.classList.remove("ebc-es-pending"); }, 2500);
            }
          }
        } catch (e) {}
      })();

    <script>
      window.__ebcConsent = (function () {
        try {
          /* The team's own visits must not count as visitors. Open any page
             with ?internal=1 once on a device and Clarity, PageSense and the
             Meta pixel stay off there; ?internal=0 switches them back on.
             The admin area sets the same flag automatically. */
          var q = location.search;
          if (q.indexOf('internal=1') !== -1) localStorage.setItem('ebc-internal', '1');
          if (q.indexOf('internal=0') !== -1) localStorage.removeItem('ebc-internal');
          if (localStorage.getItem('ebc-internal') === '1') {
            document.documentElement.classList.add('ebc-can-select');
            return { analytics: false, marketing: false, decided: true, internal: true };
          }
          var raw = localStorage.getItem('cookieConsentStatus');
          if (!raw) return { analytics: false, marketing: false, decided: false };
          var p = JSON.parse(raw);
          return { analytics: !!p.analytics, marketing: !!p.marketing, decided: true };
        } catch (e) { return { analytics: false, marketing: false, decided: false }; }
      })();
